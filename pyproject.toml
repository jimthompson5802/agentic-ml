[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-ml"
version = "0.1.0"
description = "Agent-independent machine learning experimentation harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["packaging>=26"]

[project.scripts]
agentic-ml = "agentic_ml.cli:main"

[project.urls]
Repository = "https://github.com/jimthompson5802/agentic-ml"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "D", "B", "BLE001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
