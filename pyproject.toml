[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-ml"
version = "0.1.0"
description = "Agent-independent machine learning experimentation harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4,<5",
    "nbclient>=0.10,<1",
    "ipykernel>=6,<8",
    "nbformat>=5,<6",
    "dvc>=3,<4",
    "mlflow>=3,<4",
    "pandas>=3.1,<3.2",
    "pyarrow>=25,<26",
    "pyyaml>=6,<7",
    "tomlkit>=0.13,<1",
]

[project.scripts]
agentic-ml = "agentic_ml.cli:main"

[project.urls]
Repository = "https://github.com/jimthompson5802/agentic-ml"

[dependency-groups]
dev = [
    "pytest>=8,<9.2",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "types-pyyaml>=6,<7",
    "types-jsonschema>=4,<5",
    "pytest-xdist>=3,<4",
    "pandas-stubs>=3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -m 'milestone_1 or milestone_2 or milestone_3 or milestone_4 or milestone_5 or milestone_6'"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "milestone_0: directly verifies milestone 0 requirements",
    "milestone_1: directly verifies milestone 1 requirements",
    "milestone_2: directly verifies milestone 2 requirements",
    "milestone_3: directly verifies milestone 3 requirements",
    "milestone_4: directly verifies milestone 4 requirements",
    "milestone_5: directly verifies milestone 5 requirements",
    "milestone_6: directly verifies milestone 6 requirements",
    "milestone_50: directly verifies milestone 50 requirements",
    "milestone_99: directly verifies milestone 99 requirements",
    "infrastructure: contributor tooling without direct milestone requirements",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "D", "B", "BLE001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true

[tool.uv.workspace]
members = [
    ".pytest-tmp/run/popen-gw1/test_invalid_project_is_reject0/experiment",
]
